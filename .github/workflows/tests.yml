name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and ground-truth tests
        run: python -m unittest discover -s tests -v
